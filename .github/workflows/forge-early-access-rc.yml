name: Fenton Forge early-access RC review

on:
  push:
    branches:
      - 'codex/forge-early-access-rc-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application module
        run: node --check launch/builder.js
      - name: Run journey and safety tests
        run: node --test tests/forge-journey.test.cjs
      - name: Confirm deployment payload
        run:
          test -s launch/index.html &&
          test -s launch/builder.js &&
          test -s launch/styles.css &&
          test -s launch/living-portal.css &&
          test -s launch/first-use.css &&
          test -s launch/README.md
      - name: Enforce static launch payload boundary
        shell: bash
        run: |
          set -euo pipefail
          expected_files=$(printf '%s\n' README.md builder.js first-use.css index.html living-portal.css release-ledger-2026-10-15.md release-ledger-2026-10-19.md styles.css | LC_ALL=C sort)
          actual_files=$(git ls-tree -r --name-only HEAD launch/ | sed 's|^launch/||' | LC_ALL=C sort)
          test "$actual_files" = "$expected_files"
          test -z "$(git ls-tree -r HEAD launch/ | awk '$1 != "100644" {print}')"
          test ! -e launch/package.json
          test ! -e launch/node_modules
          test ! -e launch/api
          test ! -e launch/data
